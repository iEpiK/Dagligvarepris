# Reverse proxy-oppsett for dagligvarepris-tjenesten.
# Kopier til f.eks. /etc/nginx/sites-available/grocery.conf, tilpass domenet,
# og aktiver med: ln -s /etc/nginx/sites-available/grocery.conf /etc/nginx/sites-enabled/
#
# Kjør certbot/Let's Encrypt for TLS i etterkant:
#   certbot --nginx -d dagligvarepris.example.no

server {
    listen 80;
    server_name dagligvarepris.example.no;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 5m;
}
